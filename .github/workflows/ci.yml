name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wasi:
    name: MoonBit and Wasmtime
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Wasmtime
        shell: bash
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          moon version --all
          wasmtime --version

      - name: Update Mooncakes registry
        run: moon update

      - name: Run strict checks
        run: moon check --deny-warn

      - name: Run unit tests
        run: moon test --target wasm

      - name: Build release artifacts
        run: |
          moon build --target wasm --release integration/fs
          moon build --target wasm --release integration/sys
          moon build --target wasm --release cmd/main
          moon build --target wasm --release examples/tree
          moon build --target wasm --release examples/atomic-config

      - name: Run filesystem integration
        run: >-
          wasmtime run --dir .::.
          _build/wasm/release/build/integration/fs/fs.wasm

      - name: Run system integration
        run: >-
          wasmtime run --dir .::. --env MOON_WASI_TEST=ready
          _build/wasm/release/build/integration/sys/sys.wasm

      - name: Verify generated interfaces and formatting
        run: |
          moon info
          moon fmt --check
          git diff --exit-code

      - name: Validate release package
        run: moon package --frozen --list
